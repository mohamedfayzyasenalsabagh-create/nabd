name: فحص الموقع الحقيقي
on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save --no-audit --no-fund playwright@1.47.2 firebase-admin@12 && npx playwright install --with-deps chromium
      - name: فحص الصفحات والتنزيل والدليل على الموقعين
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tests/ops/live-check.mjs
      - name: حفظ النتيجة
        if: always()
        run: |
          git config --global user.name "nabd-ci"; git config --global user.email "ci@nabd.app"
          git fetch origin ci-results:refs/remotes/origin/ci-results || true
          if git rev-parse -q --verify origin/ci-results >/dev/null; then git worktree add -B ci-results /tmp/ci origin/ci-results; else git worktree add --orphan -b ci-results /tmp/ci; fi
          mkdir -p /tmp/ci/.results && cp -r .results/. /tmp/ci/.results/ 2>/dev/null || true
          cd /tmp/ci && git add -f .results && git commit -m "نتيجة فحص الموقع الحقيقي" && for i in 1 2 3; do git push origin ci-results && break; git pull --rebase origin ci-results; done || true
