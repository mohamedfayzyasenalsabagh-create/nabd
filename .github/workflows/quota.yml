name: تنبيه توقف Firebase
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Firestore يعمل؟
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tests/ops/quota-probe.mjs
