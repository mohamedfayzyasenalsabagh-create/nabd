name: ربط الدومين
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status أو create"
        default: status
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Firebase Hosting custom domain
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACTION: ${{ inputs.action }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
          TOK=$(gcloud auth print-access-token)
          B=https://firebasehosting.googleapis.com/v1beta1/projects/nabd-platfor/sites/nabdsy/customDomains
          if [ "$ACTION" = "create" ]; then
            echo "::notice title=create apex::$(curl -s -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" "$B?customDomainId=nabd.sy" -d '{}' | jq -c '.error.message // .name' )"
            echo "::notice title=create www::$(curl -s -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" "$B?customDomainId=www.nabd.sy" -d '{"redirectTarget":"nabd.sy"}' | jq -c '.error.message // .name')"
            sleep 20
          fi
          for d in nabd.sy www.nabd.sy; do echo "===== $d"; curl -s -H "Authorization: Bearer $TOK" "$B/$d" | jq -c '{hostState,ownershipState,cert:.cert.state,issues:[.issues[]?.message],required:[.requiredDnsUpdates.desired[]?|{d:.domainName,r:[.records[]?|{t:.type,v:.rdata,a:.requiredAction}]}]}' > o.json; echo "::notice title=$d::$(cat o.json)"; done
          D=""; for t in NS A TXT; do D="$D $t=[$(dig +short $t nabd.sy | tr '\n' ' ')]"; done
          echo "::notice title=DNS::$D www=[$(dig +short www.nabd.sy | tr '\n' ' ')]"
