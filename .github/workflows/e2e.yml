name: اختبار العمل دون إنترنت
on:
  push:
    branches: [main]
    paths: ["*.js", "*.html", "styles.css", "firestore.rules", "demo/**", "tests/e2e/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: الاختبار مع Firebase على المحاكي
        run: |
          set -o pipefail
          npx firebase emulators:exec --only auth,firestore --project nabd-platfor "node tests/e2e/offline.mjs" 2>&1 | tee e2e-log.txt
      - name: حفظ النتيجة
        if: always()
        run: |
          mkdir -p .results/e2e && cp e2e-log.txt .results/e2e/ || true
          git config user.name "nabd-ci"; git config user.email "ci@nabd.app"
          git fetch origin ci-results || true
          git checkout -B ci-results
          git add -f .results/e2e && git commit -m "نتيجة اختبار العمل دون إنترنت" && git push -f origin ci-results || true
