name: اختبار تطبيق أندرويد على جوال افتراضي
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "tests/android/**", ".github/workflows/android-test.yml"]
permissions:
  contents: write
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p android assembleDebug --no-daemon
      - name: تفعيل KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: الجوال الافتراضي
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tests/android/run.sh
      - name: حفظ النتيجة
        if: always()
        run: |
          git config --global user.name "nabd-ci"; git config --global user.email "ci@nabd.app"
          git fetch origin ci-results:refs/remotes/origin/ci-results || true
          if git rev-parse -q --verify origin/ci-results >/dev/null; then git worktree add -B ci-results /tmp/ci origin/ci-results; else git worktree add --orphan -b ci-results /tmp/ci; fi
          mkdir -p /tmp/ci/.results && cp -r .results/. /tmp/ci/.results/ 2>/dev/null || true
          cd /tmp/ci && git add -f .results && git commit -m "نتيجة اختبار أندرويد" && for i in 1 2 3; do git push origin ci-results && break; git pull --rebase origin ci-results; done || true
