name: بناء تطبيق أندرويد
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      # التحقق من أن الكود يُبنى (لا يحتاج مفتاح التوقيع)
      - name: فحص البناء
        run: gradle -p android assembleDebug --no-daemon

      # مفتاح التوقيع لا يُحفظ في المستودع، بل في أسرار GitHub
      - name: تجهيز مفتاح التوقيع من الأسرار
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::لم تُضف أسرار التوقيع بعد (ANDROID_KEYSTORE_B64 و ANDROID_KEYSTORE_PASSWORD)، لذلك لن تُنشر نسخة جديدة."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: بناء APK و AAB الموقّعين
        if: steps.key.outputs.ok == 'true'
        env:
          VERSION_CODE: "${{ github.run_number }}"
          KEYSTORE_FILE: "${{ runner.temp }}/release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease bundleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk nabd.apk
          cp android/app/build/outputs/bundle/release/app-release.aab nabd-play.aab

      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.ok == 'true'
        with:
          tag_name: app-v${{ github.run_number }}
          name: تطبيق نبض (نسخة ${{ github.run_number }})
          make_latest: "true"
          files: |
            nabd.apk
            nabd-play.aab
          body: "nabd.apk للتثبيت المباشر على الجوال. nabd-play.aab للرفع على Google Play."
