name: اختبار قواعد الحماية
on:
  push:
    paths: ["firestore.rules", "tests/**", ".github/workflows/rules.yml"]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules 2>&1 | tee rules-result.txt
      - name: حفظ النتيجة
        if: always()
        run: |
          mkdir -p .results && cp rules-result.txt .results/ || true
          git config user.name "nabd-ci"; git config user.email "ci@nabd.app"
          git fetch origin ci-results || true
          git checkout -B ci-results
          git add -f .results/rules-result.txt && git commit -m "نتيجة اختبار القواعد" && git push -f origin ci-results || true
    permissions:
      contents: write
