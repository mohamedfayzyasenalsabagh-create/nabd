# نشر الموقع على nabdsy.web.app وقواعد الحماية تلقائياً عند كل تعديل
# يحتاج السر FIREBASE_SERVICE_ACCOUNT (مفتاح حساب الخدمة من Firebase)
name: نشر Firebase
on:
  push:
    branches: [main]
    paths-ignore: ["android/**", ".github/workflows/android.yml", "*.md"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # لا تُنشر قواعد الحماية إلا إذا نجحت كل اختباراتها (حتى لا تتعطل العيادات بقاعدة خاطئة)
      - name: اختبار قواعد الحماية قبل النشر
        run: |
          npm install --no-audit --no-fund >/dev/null
          set -o pipefail; npm run test:rules 2>&1 | tail -5
      - name: النشر
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::لم يُضبط FIREBASE_SERVICE_ACCOUNT، تم التخطي"; exit 0; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -e "console.log(require('$RUNNER_TEMP/sa.json').project_id)")
          npm i -g firebase-tools@13 >/dev/null
          firebase deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive
          if git diff --name-only HEAD~1 HEAD | grep -q '^functions/'; then
            (cd functions && npm install --no-audit --no-fund)
            firebase deploy --only functions --project "$PROJECT" --non-interactive || echo "خدمات الخادم تتطلب خطة Blaze"
          fi
