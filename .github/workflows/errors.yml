name: تقرير أعطال التطبيق اليومي
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: قراءة سجل الأعطال (دون بيانات مرضى)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tests/ops/errors-report.mjs
      - name: استهلاك Firebase مقارنة بالحد المجاني
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tests/ops/usage.mjs
      - name: حفظ التقرير
        run: |
          git config --global user.name "nabd-ci"; git config --global user.email "ci@nabd.app"
          git fetch origin ci-results:refs/remotes/origin/ci-results || true
          if git rev-parse -q --verify origin/ci-results >/dev/null; then git worktree add -B ci-results /tmp/ci origin/ci-results; else git worktree add --orphan -b ci-results /tmp/ci; fi
          mkdir -p /tmp/ci/.results && cp -r .results/. /tmp/ci/.results/ 2>/dev/null || true
          cd /tmp/ci && git add -f .results && git commit -m "تقرير الأعطال" && for i in 1 2 3; do git push origin ci-results && break; git pull --rebase origin ci-results; done || true
