<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- ريل «المخطط الهندسي»: مخطط عيادة بخطوط بيضاء على أزرق، غرف = أقسام التطبيق، تدخل بطاقة موظف فتُفتح غرفه وتُقفل البقية ← الشعار. الإعداد في cfg.js (CFG) -->
<style>
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-500-normal.woff2);font-weight:500;unicode-range:U+0000-00FF}
@font-face{font-family:K;src:url(fntfiles/reem-kufi-arabic-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:clip;font-family:P,sans-serif;background:#0b3a6e;color:#eaf4ff}
#R{position:absolute;inset:0;overflow:hidden;background:#0b3a6e}
#g1,#g2{position:absolute;inset:-100px}
#g1{background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px}
#g2{background-image:linear-gradient(rgba(255,255,255,.14) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.14) 2px,transparent 2px);background-size:150px 150px}
#cap{position:absolute;top:140px;left:60px;right:60px;text-align:center;font-size:72px;font-weight:700;line-height:1.3}
#cap b{color:#ffd166}
#plan{position:absolute;left:70px;right:70px;top:420px;height:1020px}
#plan svg{position:absolute;inset:0}
.rm{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;border:4px solid #eaf4ff;transition:none}
.rm .ic{font-size:76px;line-height:1}
.rm .t{font-size:44px;font-weight:700}
.rm .st{position:absolute;top:16px;left:16px;font-size:44px}
.rm .ro{position:absolute;bottom:14px;font-size:30px;font-weight:700;padding:4px 18px;border-radius:99px;background:#ffd166;color:#0b3a6e}
#badge{position:absolute;left:150px;right:150px;top:1500px;height:200px;border-radius:36px;background:#eaf4ff;color:#0b3a6e;display:flex;align-items:center;gap:30px;padding:0 40px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#badge .av{width:120px;height:120px;border-radius:50%;background:#0b3a6e;color:#ffd166;display:grid;place-items:center;font-size:62px}
#badge .rn{font-size:58px;font-weight:700}
#badge .rs{font-size:34px;font-weight:500;opacity:.7}
#badge:before{content:"";position:absolute;top:-40px;left:50%;width:60px;height:40px;margin-left:-30px;border:8px solid #eaf4ff;border-bottom:none;border-radius:30px 30px 0 0}
#dim{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:30px;opacity:.5;direction:ltr;letter-spacing:6px}
#logo{position:absolute;left:0;right:0;top:520px;text-align:center;display:none}
#mk{width:240px;height:240px;margin:0 auto;border-radius:64px;background:#eaf4ff;display:grid;place-items:center;box-shadow:0 30px 90px rgba(0,0,0,.35)}
#nm{font-family:K;font-size:150px;margin-top:30px}
#sl{font-size:58px;margin-top:16px;font-weight:700}
#fr{display:inline-block;margin-top:70px;background:#ffd166;color:#0b3a6e;font-size:52px;font-weight:700;padding:18px 44px;border-radius:99px}
#url{font-size:48px;margin-top:44px;direction:ltr;font-weight:700;color:#9fd3ff}
</style></head><body><div id="R">
<div id="g1"></div><div id="g2"></div>
<div id="cap"></div>
<div id="plan"><svg viewBox="0 0 940 1020"><path id="draw" d="" fill="none" stroke="#eaf4ff" stroke-width="3" stroke-dasharray="14 10" pathLength="1"/></svg></div>
<div id="badge"><div class="av"></div><div><div class="rn"></div><div class="rs"></div></div></div>
<div id="dim">CLINIC · PLAN · A-01</div>
<div id="logo"><div id="mk"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#0b3a6e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="pl" d="M2 12h4l2.5-6 4 12 3-9 2 3h4.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><div id="nm">نبض</div><div id="sl"></div><div id="fr">🎁 جرّبوه مجاناً 14 يوماً</div><div id="url">nabd.sy</div></div>
</div>
<script src="cfg.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s),B=60/C.bpm;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
// شبكة الغرف 2×3 داخل المخطط (940×1020)
const W=940,H=1020,gap=24,cw=(W-gap)/2,ch=(H-2*gap)/3;
const rooms=C.rooms.map((r,i)=>{const col=i%2,row=Math.floor(i/2);const x=col===0?W-cw:0,y=row*(ch+gap);
  const d=document.createElement("div");d.className="rm";Object.assign(d.style,{left:x+"px",top:y+"px",width:cw+"px",height:ch+"px"});
  d.innerHTML=`<div class="st"></div><div class="ic">${r.ic}</div><div class="t">${r.t}</div><div class="ro" style="display:none">عرض فقط</div>`;$("#plan").appendChild(d);return d;});
// الخط الزمني
const DRAW=0, ROLES=C.introB*B, roleT=C.roles.map((_,i)=>ROLES+i*C.roleB*B), OUT=ROLES+C.roles.length*C.roleB*B, LOGO=OUT+C.outB*B, TOTAL=LOGO+C.endB*B;
const unlocks=[]; C.roles.forEach((r,i)=>C.rooms.forEach((rm,j)=>{if(r.k[rm.k]) unlocks.push(roleT[i]+.5*B+j*.12);}));
window.TOTAL=TOTAL; window.EVENTS={bpm:C.bpm,total:TOTAL,roles:roleT,unlocks,out:OUT,logo:LOGO};
$("#sl").textContent=C.slogan;
function render(t){
  $("#g1").style.transform=`translate(${-t*8}px,${-t*5}px)`; $("#g2").style.transform=`translate(${-t*8}px,${-t*5}px)`;
  const lg=t-LOGO, fo=1-cl(lg*4);
  // العنوان
  const cp=$("#cap"); const ri=roleT.filter(x=>t>=x).length-1;
  const capTxt=t<ROLES?C.cap0:t<OUT?C.cap1:C.cap2; cp.innerHTML=capTxt; const cst=t<ROLES?0:t<OUT?ROLES:OUT; cp.style.opacity=ease((t-cst)*3)*fo;
  // رسم الغرف: الحدود تظهر بالتتابع في البداية
  rooms.forEach((d,j)=>{const a=t-.15-j*.18; d.style.opacity=(a<0?0:ease(a*3))*fo; d.style.transform=`scale(${a<0?.9:.9+.1*back(a*3)})`;
    const st=d.querySelector(".st"), ro=d.querySelector(".ro"); const rm=C.rooms[j];
    if(ri<0){d.style.background="rgba(234,244,255,.06)"; st.textContent=""; d.style.borderStyle="solid"; ro.style.display="none"; d.style.filter="none"; return;}
    const role=C.roles[ri], on=role.k[rm.k], ua=t-(roleT[ri]+.5*B+j*.12);
    if(on&&ua>0){const p=ease(ua*4); d.style.background=`rgba(94,234,212,${.32*p})`; d.style.borderColor="#5eead4"; st.textContent="🔓"; d.style.filter="none"; d.style.borderStyle="solid";
      ro.style.display=on==="read"?"block":"none"; d.style.transform=`scale(${1+.06*Math.sin(cl(ua*4)*Math.PI)})`;}
    else {d.style.background="rgba(10,25,50,.35)"; d.style.borderColor="rgba(234,244,255,.35)"; st.textContent="🔒"; d.style.filter="saturate(.2) brightness(.7)"; d.style.borderStyle="dashed"; ro.style.display="none";}
  });
  // بطاقة الموظف
  const bd=$("#badge");
  if(ri>=0&&t<OUT){const r=C.roles[ri], a=t-roleT[ri]; bd.querySelector(".av").textContent=r.ic; bd.querySelector(".rn").textContent=r.n; bd.querySelector(".rs").textContent=r.s;
    const lv=t-(roleT[ri]+C.roleB*B-.3); bd.style.opacity=1; bd.style.transform=`translateY(${(1-back(a*3))*500+(lv>0?ease(lv*4)*500:0)}px) rotate(${(1-ease(a*3))*-8}deg)`;}
  else bd.style.opacity=0;
  const lgd=$("#logo"); lgd.style.display=lg>0?"block":"none"; $("#dim").style.opacity=.5*fo;
  if(lg>0){$("#mk").style.transform=`scale(${back(lg*2)})`; $("#pl").style.strokeDashoffset=1-ease((lg-.2)/1);
    [["#nm",.4],["#sl",.9],["#fr",1.5],["#url",2.0]].forEach(([s,d])=>{const e=$(s),x=ease((lg-d)*2.5);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*40}px)`});}
}
window.render=render;
</script></body></html>
