<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- ريل «عدسة الكاميرا»: منظور كاميرا الجوال يقترب من ملصق QR على جدار الاستقبال ← إطار المسح يقفل بالأخضر ← شاشة المريض «تم تسجيل حضورك» ← قائمة الاستقبال تتحدّث ← الشعار.
     يحتاج qr.js (انسخ qrcode.js من جذر المستودع إلى مجلد العمل باسم qr.js). الإعداد في cfg.js (CFG) -->
<style>
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-500-normal.woff2);font-weight:500;unicode-range:U+0000-00FF}
@font-face{font-family:K;src:url(fntfiles/reem-kufi-arabic-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:clip;font-family:P,sans-serif;background:#111;color:#fff}
#R{position:absolute;inset:0;overflow:hidden}
/* المشهد: جدار استقبال تجريدي */
#scene{position:absolute;inset:0;transform-origin:540px 720px;background:linear-gradient(#e9e4dc 0 62%,#c9b9a3 62% 100%)}
#scene .win{position:absolute;top:140px;left:80px;width:260px;height:420px;border-radius:20px;background:linear-gradient(#bfe3f5,#e8f6fd);box-shadow:inset 0 0 0 14px #fff}
#scene .plant{position:absolute;bottom:560px;right:90px;width:150px;height:300px}
#scene .plant i{position:absolute;bottom:0;left:35px;width:80px;height:110px;background:#9c6b4a;border-radius:10px 10px 22px 22px}
#scene .plant b{position:absolute;width:90px;height:170px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3f8f6b;bottom:90px}
#desk{position:absolute;left:-40px;right:-40px;top:1190px;height:200px;background:#8a6a4f;border-radius:20px}
#poster{position:absolute;left:330px;top:420px;width:420px;height:560px;background:#fff;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;padding-top:34px;gap:18px;color:#0b3b37}
#poster .ph{font-size:38px;font-weight:700;text-align:center;line-height:1.3}
#qr{width:300px;height:300px}
#qr svg{width:100%;height:100%}
#poster .pf{font-size:30px;font-weight:700;color:#0d9488}
#blur{position:absolute;inset:0;backdrop-filter:blur(0px)}
/* واجهة الكاميرا */
#cam{position:absolute;inset:0;pointer-events:none}
#cam .top{position:absolute;top:0;left:0;right:0;height:170px;background:linear-gradient(rgba(0,0,0,.55),transparent);display:flex;justify-content:center;align-items:flex-start;padding-top:56px;font-size:38px;font-weight:700;letter-spacing:2px}
#cam .bot{position:absolute;bottom:0;left:0;right:0;height:330px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
#shut{position:absolute;bottom:110px;left:50%;width:150px;height:150px;margin-left:-75px;border-radius:50%;border:10px solid #fff}
#fr{position:absolute;left:270px;top:450px;width:540px;height:540px}
#fr i{position:absolute;width:110px;height:110px;border:12px solid #fff;filter:drop-shadow(0 0 10px rgba(0,0,0,.4))}
#fr i:nth-child(1){top:0;right:0;border-left:none;border-bottom:none;border-radius:0 34px 0 0}
#fr i:nth-child(2){top:0;left:0;border-right:none;border-bottom:none;border-radius:34px 0 0 0}
#fr i:nth-child(3){bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 34px 0}
#fr i:nth-child(4){bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 34px}
#laser{position:absolute;left:30px;right:30px;height:8px;border-radius:4px;background:#5eead4;box-shadow:0 0 30px 8px rgba(94,234,212,.7)}
#hint{position:absolute;top:130px;left:0;right:0;text-align:center;font-size:44px;font-weight:700;text-shadow:0 4px 16px rgba(0,0,0,.6)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
/* شاشة المريض */
#pat{position:absolute;inset:0;background:linear-gradient(170deg,#0f766e,#064e48);display:none}
#pcard{position:absolute;left:90px;right:90px;top:560px;border-radius:50px;background:#fff;color:#0b3b37;padding:70px 50px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3)}
#ok{width:200px;height:200px;margin:0 auto 30px;border-radius:50%;background:#14b8a6;display:grid;place-items:center}
#pcard h2{font-size:76px}
#pcard p{font-size:46px;font-weight:500;margin-top:24px;color:#52606d}
#pcard .num{display:inline-block;margin-top:34px;font-size:140px;font-weight:700;color:#0d9488;line-height:1}
#pcard .nl{font-size:40px;font-weight:700;color:#52606d}
/* شاشة الاستقبال */
#rec{position:absolute;inset:0;background:#f1f5f9;display:none;color:#1f2933}
#rh{position:absolute;top:470px;left:60px;right:60px;font-size:50px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#rh span{font-size:34px;color:#64748b;font-weight:500}
#rl{position:absolute;top:580px;left:60px;right:60px}
.ap{height:160px;border-radius:32px;background:#fff;margin-bottom:24px;display:flex;align-items:center;gap:28px;padding:0 34px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.ap .tm{font-size:40px;font-weight:700;color:#0d9488;direction:ltr;width:130px;text-align:center}
.ap .nm{font-size:48px;font-weight:700;flex:1}
.ap .ch{font-size:34px;font-weight:700;padding:10px 22px;border-radius:99px;background:#ccfbf1;color:#0f766e;white-space:nowrap}
.ap .wt{font-size:34px;color:#94a3b8;font-weight:500}
#cap{position:absolute;top:170px;left:60px;right:60px;text-align:center;font-size:76px;font-weight:700;line-height:1.3;z-index:30}
#cap b{color:#ffd166}
#title{position:absolute;inset:0;background:#0b1220;display:grid;place-items:center;text-align:center;z-index:40}
#title div{font-size:100px;font-weight:700;line-height:1.3}
#title b{color:#5eead4}
#logo{position:absolute;inset:0;background:linear-gradient(170deg,#0f766e,#064e48);text-align:center;display:none;z-index:50;padding-top:520px}
#mk{width:240px;height:240px;margin:0 auto;border-radius:64px;background:#fff;display:grid;place-items:center;box-shadow:0 30px 90px rgba(0,0,0,.3)}
#nm{font-family:K;font-size:150px;margin-top:30px}
#sl{font-size:58px;margin-top:16px;font-weight:700}
#frl{display:inline-block;margin-top:70px;background:#ffd166;color:#063b36;font-size:52px;font-weight:700;padding:18px 44px;border-radius:99px}
#url{font-size:48px;margin-top:44px;direction:ltr;font-weight:700;color:#ccfbf1}
</style></head><body><div id="R">
<div id="scene"><div class="win"></div><div class="plant"><b style="left:0"></b><b style="left:60px;bottom:120px"></b><i></i></div><div id="desk"></div>
  <div id="poster"><div class="ph"></div><div id="qr"></div><div class="pf">نبض</div></div></div>
<div id="cam"><div class="top">QR</div><div class="bot"></div><div id="shut"></div><div id="fr"><i></i><i></i><i></i><i></i><div id="laser"></div></div><div id="hint"></div></div>
<div id="flash"></div>
<div id="pat"><div id="pcard"><div id="ok"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path id="tick" d="M5 12.5l4.5 4.5L19 7.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><h2></h2><p></p><div class="num"></div><div class="nl"></div></div></div>
<div id="rec"><div id="rh"><div></div><span></span></div><div id="rl"></div></div>
<div id="cap"></div>
<div id="title"><div></div></div>
<div id="logo"><div id="mk"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#0d6b66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="pl" d="M2 12h4l2.5-6 4 12 3-9 2 3h4.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><div id="nm">نبض</div><div id="sl"></div><div id="frl">🎁 جرّبوه مجاناً 14 يوماً</div><div id="url">nabd.sy</div></div>
</div>
<script src="qr.js"></script>
<script src="cfg.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s),B=60/C.bpm;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), io=x=>{x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
// رمز QR حقيقي (يشير إلى موقع نبض فقط)
const q=qrcode(0,"M"); q.addData(C.qrData); q.make(); $("#qr").innerHTML=q.createSvgTag({cellSize:8,margin:0,scalable:true});
$("#poster .ph").innerHTML=C.poster; $("#hint").textContent=C.hint; $("#title div").innerHTML=C.title; $("#sl").textContent=C.slogan;
$("#pcard h2").textContent=C.ok; $("#pcard p").textContent=C.okSub; $("#pcard .num").textContent=C.num; $("#pcard .nl").textContent=C.numL;
$("#rh div").textContent=C.recT; $("#rh span").textContent=C.recSub;
$("#rl").innerHTML=C.appts.map(a=>`<div class="ap"><div class="tm">${a.tm}</div><div class="nm">${a.n}</div><div class="${a.ch?'ch':'wt'}">${a.ch?C.chip:a.st}</div></div>`).join("");
const aps=[...document.querySelectorAll(".ap")], hit=C.appts.findIndex(a=>a.me);
// الخط الزمني
const CAM=C.titleB*B, LOCK=CAM+C.camB*B, PAT=LOCK+1.5*B, REC=PAT+C.patB*B, CHIP=REC+1.5*B, END=REC+C.recB*B, LOGO=END+C.capB*B, TOTAL=LOGO+C.endB*B;
window.TOTAL=TOTAL; window.EVENTS={bpm:C.bpm,total:TOTAL,cam:CAM,lock:LOCK,pat:PAT,rec:REC,chip:CHIP,end:END,logo:LOGO};
function render(t){
  const ti=$("#title"), tf=cl((t-CAM+.2)*5); ti.style.opacity=1-tf; ti.style.display=tf>=1?"none":"grid"; ti.firstElementChild.style.transform=`scale(${.85+.15*back(t*2)})`;
  // الكاميرا تقترب من الملصق مع اهتزاز اليد
  const ca=cl((t-CAM)/(LOCK-CAM)); const z=1+.75*io(ca); const sx=Math.sin(t*3.1)*6*(1-ca*.6), sy=Math.cos(t*2.3)*5*(1-ca*.6);
  const lk=t-LOCK;
  $("#scene").style.transform=`translate(${sx}px,${sy}px) scale(${lk>0?z+.02*Math.sin(cl(lk*4)*Math.PI):z})`;
  // إطار المسح يضيق قليلاً ثم يقفل بالأخضر
  const fr=$("#fr"); const fs=lk>0?.9+.1*(1-back(lk*4))*-1+0:1; fr.style.transform=`scale(${lk>0?1-.06*ease(lk*5):1+.04*Math.sin(t*6)})`;
  fr.querySelectorAll("i").forEach(i=>i.style.borderColor=lk>0?"#5eead4":"#fff");
  const ls=$("#laser"); ls.style.opacity=t>CAM&&lk<0?1:0; ls.style.top=(30+(Math.sin((t-CAM)*4)*.5+.5)*470)+"px";
  $("#hint").textContent=lk>0?C.hintOk:C.hint; $("#hint").style.color=lk>0?"#5eead4":"#fff";
  $("#flash").style.opacity=lk>0&&lk<.3?.6*(1-lk/.3):0;
  // شاشة المريض
  const pa=t-PAT, P=$("#pat"); P.style.display=pa>0&&t<REC+.4?"block":"none";
  if(pa>0){P.style.clipPath=`circle(${ease(pa*2.5)*150}% at 50% 45%)`; $("#pcard").style.transform=`translateY(${(1-back(pa*2.5))*300}px)`;
    $("#tick").style.strokeDashoffset=1-ease((pa-.3)*3); $("#ok").style.transform=`scale(${back((pa-.1)*3)})`;
    $("#pcard .num").style.transform=`scale(${back((pa-.7)*3)})`;}
  // شاشة الاستقبال
  const ra=t-REC, Rc=$("#rec"); Rc.style.display=ra>0?"block":"none";
  if(ra>0){Rc.style.transform=`translateX(${(1-ease(ra*2.5))*-1080}px)`;
    aps.forEach((a,i)=>{a.style.opacity=ease((ra-.1-i*.08)*5); const last=a.lastElementChild;
      if(i===hit){const c=t-CHIP; if(c>0){last.className="ch"; last.textContent=C.chip; last.style.transform=`scale(${back(c*3)})`; a.style.boxShadow=`0 0 0 ${6*ease(c*3)}px #5eead4, 0 8px 24px rgba(15,23,42,.08)`;}
        else {last.className="wt"; last.textContent=C.appts[i].st; last.style.transform="none"; a.style.boxShadow="";}}});}
  // العناوين
  const cp=$("#cap"); let txt="",st=0,col="#fff";
  if(t>=CAM&&t<PAT){txt=C.cap1;st=CAM;cp.style.top="1240px";} else cp.style.top="170px"; if(t>=CAM&&t<PAT){} else if(t>=PAT&&t<REC){txt=C.cap2;st=PAT;} else if(t>=REC&&t<END){txt=C.cap3;st=REC;col="#1f2933";} else if(t>=END&&t<LOGO){txt=C.cap4;st=END;col="#1f2933";}
  cp.innerHTML=txt; cp.style.color=col; cp.style.opacity=ease((t-st)*4); cp.style.transform=`translateY(${(1-ease((t-st)*4))*30}px)`;
  cp.style.textShadow=col==="#fff"?"0 6px 24px rgba(0,0,0,.6)":"none";
  const lg=t-LOGO, L=$("#logo"); L.style.display=lg>0?"block":"none";
  if(lg>0){L.style.clipPath=`circle(${ease(lg*2)*150}% at 50% 50%)`; $("#mk").style.transform=`scale(${back(lg*2)})`; $("#pl").style.strokeDashoffset=1-ease((lg-.2)/1);
    [["#nm",.4],["#sl",.9],["#frl",1.5],["#url",2.0]].forEach(([s,d])=>{const e=$(s),x=ease((lg-d)*2.5);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*40}px)`});}
}
window.render=render;
</script></body></html>
