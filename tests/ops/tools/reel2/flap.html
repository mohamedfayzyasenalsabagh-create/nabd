<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- ريل «لوحة المطار»: لوحة رحلات بخانات قلّابة (سبليت-فلاب) تعرض أطباء المركز: الطبيب، الاختصاص، الدور الآن، بالانتظار.
     الخانات تقلب عند كل تحديث كأنها لوحة مغادرة ← الشعار. الإعداد في cfg.js (CFG) -->
<style>
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-500-normal.woff2);font-weight:500;unicode-range:U+0000-00FF}
@font-face{font-family:K;src:url(fntfiles/reem-kufi-arabic-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:clip;font-family:P,sans-serif;background:#141414;color:#f5f1e6}
#R{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#1d1d1f,#0d0d0e)}
#hdr{position:absolute;top:120px;left:40px;right:40px;display:flex;align-items:center;justify-content:space-between}
#hdr .t{font-size:56px;font-weight:700;color:#ffcc33}
#hdr .clk{font-size:56px;font-weight:700;direction:ltr;color:#ffcc33}
#sub{position:absolute;top:210px;left:40px;right:40px;font-size:34px;color:#a8a39a;font-weight:500}
#board{position:absolute;top:330px;left:30px;right:30px;background:#0a0a0a;border-radius:20px;padding:24px 18px;box-shadow:0 0 0 6px #2a2a2c,0 30px 80px rgba(0,0,0,.6)}
.hrow,.row{display:grid;grid-template-columns:100px 1fr 240px 180px 150px;gap:12px;align-items:center}
.hrow{font-size:34px;color:#ffcc33;font-weight:700;padding:0 6px 16px;border-bottom:3px solid #2a2a2c;margin-bottom:16px}
.row{margin-bottom:22px}
.fl{position:relative;height:160px;border-radius:10px;background:linear-gradient(#2b2b2d 0 50%,#232325 50% 100%);display:grid;place-items:center;font-size:50px;font-weight:700;overflow:hidden;box-shadow:inset 0 2px 0 rgba(255,255,255,.06)}
.fl:after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#0a0a0a}
.fl .v{white-space:nowrap}
.fl .fold{position:absolute;left:0;right:0;top:0;height:50%;background:#333336;transform-origin:50% 100%;border-radius:10px 10px 0 0;opacity:0}
.fl.ltr .v{direction:ltr}
.fl.big{font-size:64px;color:#ffcc33}
.fl.wait .v{color:#7ee0c0}
#cap{position:absolute;top:1340px;left:50px;right:50px;text-align:center;font-size:70px;font-weight:700;line-height:1.35}
#cap b{color:#ffcc33}
#led{position:absolute;bottom:120px;left:30px;right:30px;height:90px;border-radius:12px;background:#0a0a0a;overflow:hidden;box-shadow:0 0 0 4px #2a2a2c}
#led span{position:absolute;top:12px;white-space:nowrap;font-size:52px;font-weight:700;color:#ff9f1a;text-shadow:0 0 12px rgba(255,159,26,.7)}
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#0d0d0e}
#title .fl{width:900px;height:170px;font-size:78px;color:#f5f1e6}
#logo{position:absolute;inset:0;z-index:40;display:none;text-align:center;padding-top:520px;background:#0d0d0e}
#mk{width:240px;height:240px;margin:0 auto;border-radius:64px;background:#14b8a6;display:grid;place-items:center}
#nm{font-family:K;font-size:150px;margin-top:30px}
#sl{font-size:58px;margin-top:16px;font-weight:700}
#fr{display:inline-block;margin-top:70px;background:#ffcc33;color:#141414;font-size:52px;font-weight:700;padding:18px 44px;border-radius:12px}
#url{font-size:48px;margin-top:44px;direction:ltr;font-weight:700;color:#7ee0c0}
</style></head><body><div id="R">
<div id="hdr"><div class="t"></div><div class="clk"></div></div><div id="sub"></div>
<div id="board"><div class="hrow"></div><div id="rows"></div></div>
<div id="cap"></div>
<div id="led"><span></span></div>
<div id="title"></div>
<div id="logo"><div id="mk"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="pl" d="M2 12h4l2.5-6 4 12 3-9 2 3h4.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><div id="nm">نبض</div><div id="sl"></div><div id="fr">🎁 جرّبوه مجاناً 14 يوماً</div><div id="url">nabd.sy</div></div>
</div>
<script src="cfg.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s),B=60/C.bpm;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
$("#hdr .t").textContent=C.boardT; $("#sub").textContent=C.sub; $("#sl").textContent=C.slogan; $("#led span").textContent=C.led;
$(".hrow").innerHTML=C.cols.map(c=>`<div>${c}</div>`).join("");
// كل خانة: قائمة تغييرات [{t, v}] تقلب عندها
const flaps=[];
function mk(parent,cls,changes){const d=document.createElement("div");d.className="fl "+(cls||"");d.innerHTML=`<div class="v"></div><div class="fold"></div>`;parent.appendChild(d);flaps.push({d,v:d.firstChild,f:d.lastChild,changes});return d;}
const T1=C.titleB*B; // تبدأ اللوحة
C.rows.forEach((r,i)=>{const row=document.createElement("div");row.className="row";$("#rows").appendChild(row);
  const base=T1+.4+i*.25;
  mk(row,"ltr big",[{t:base,v:r.l}]); mk(row,"",[{t:base+.1,v:"د. "+r.n}]); mk(row,"",[{t:base+.2,v:r.s}]);
  mk(row,"ltr big",[{t:base+.3,v:r.l+r.q}].concat((r.qn||[]).map(([b,v])=>({t:T1+b*B,v:r.l+v}))));
  mk(row,"wait ltr",[{t:base+.4,v:String(r.w)}].concat((r.wn||[]).map(([b,v])=>({t:T1+b*B,v:String(v)}))));});
// عنوان البداية من خانات قلّابة
C.title.forEach((line,i)=>mk($("#title"),"",[{t:.2+i*.35,v:line}]));
const NOISE=C.noise;
const flipTimes=[]; flaps.forEach(F=>F.changes.forEach(c=>flipTimes.push(c.t)));
const LOGO=T1+C.boardB*B, TOTAL=LOGO+C.endB*B;
window.TOTAL=TOTAL; window.EVENTS={bpm:C.bpm,total:TOTAL,board:T1,flips:flipTimes.sort((a,b)=>a-b),logo:LOGO};
const FL=.42; // مدة القلب
function render(t){
  flaps.forEach((F,k)=>{let cur="",flip=-1;
    F.changes.forEach(c=>{if(t>=c.t+FL) cur=c.v; else if(t>=c.t) flip=t-c.t;});
    if(flip>=0){const step=Math.floor(flip/.06); F.v.textContent=NOISE[(k*7+step*3)%NOISE.length]; const ph=(flip%.06)/.06;
      F.f.style.opacity=1; F.f.style.transform=`scaleY(${1-ph})`;}
    else {F.v.textContent=cur; F.f.style.opacity=0;}});
  const ti=$("#title"), tf=cl((t-T1+.25)*5); ti.style.opacity=1-tf; ti.style.display=tf>=1?"none":"flex";
  // الساعة تتقدم
  const m=Math.floor(C.min0+t*C.minRate); $("#hdr .clk").textContent=`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
  // شريط LED متحرك
  const sp=$("#led span"); const w=sp.offsetWidth||1600; sp.style.left=(-w+((t*220)%(w+1080)))+"px";
  // العناوين تتبدّل
  const cs=C.caps.filter(c=>t>=T1+c.b*B); const c=cs[cs.length-1]; const cp=$("#cap");
  if(c){cp.innerHTML=c.t; const a=t-(T1+c.b*B); cp.style.opacity=ease(a*4); cp.style.transform=`translateY(${(1-ease(a*4))*40}px)`;} else cp.style.opacity=0;
  const lg=t-LOGO, L=$("#logo"); L.style.display=lg>0?"block":"none";
  if(lg>0){L.style.opacity=ease(lg*3); $("#mk").style.transform=`scale(${back(lg*2)})`; $("#pl").style.strokeDashoffset=1-ease((lg-.2)/1);
    [["#nm",.4],["#sl",.9],["#fr",1.5],["#url",2.0]].forEach(([s,d])=>{const e=$(s),x=ease((lg-d)*2.5);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*40}px)`});}
}
window.render=render;
</script></body></html>
