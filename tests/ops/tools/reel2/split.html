<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- ريل «شاشة منقسمة»: نصف علوي «دون نبض» ونصف سفلي «مع نبض» يجريان معاً على نفس الأحداث، ثم تنتصر الشاشة السفلية وتملأ الإطار ← الشعار. الإعداد في cfg.js (CFG) -->
<style>
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-500-normal.woff2);font-weight:500;unicode-range:U+0000-00FF}
@font-face{font-family:K;src:url(fntfiles/reem-kufi-arabic-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:clip;font-family:P,sans-serif;background:#000;color:#fff}
#R{position:absolute;inset:0;overflow:hidden}
.half{position:absolute;left:0;right:0;overflow:hidden}
#A{top:0;height:960px;background:linear-gradient(160deg,#3b1d24,#1c0f14)}
#Bh{top:960px;height:960px;background:linear-gradient(160deg,#0f4f4a,#062a27)}
#div{position:absolute;left:0;right:0;top:952px;height:16px;background:#fff;z-index:9;box-shadow:0 0 40px rgba(255,255,255,.6)}
#vs{position:absolute;left:50%;top:960px;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:#fff;color:#111;font-size:60px;font-weight:700;display:grid;place-items:center;z-index:10;direction:ltr}
.tag{position:absolute;top:50px;right:60px;font-size:46px;font-weight:700;padding:12px 34px;border-radius:99px}
#A .tag{background:#ff5d6c;color:#fff}
#Bh .tag{background:#5eead4;color:#063b36}
.ev{position:absolute;top:150px;left:60px;right:60px;font-size:54px;font-weight:700;opacity:.9}
.shelf{position:absolute;left:60px;right:60px;top:280px}
.it{display:flex;align-items:center;gap:26px;margin-bottom:30px}
.ico{font-size:66px;width:90px;text-align:center}
.nm{width:250px;font-size:46px;font-weight:700}
.bar{flex:1;height:54px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.fill{position:absolute;top:0;bottom:0;right:0;border-radius:99px;background:#5eead4}
#A .fill{background:rgba(255,255,255,.35)}
.q{width:120px;font-size:46px;font-weight:700;text-align:left;direction:ltr}
#A .q{opacity:.45}
.note{position:absolute;font-size:46px;font-weight:700;color:#3a2a00;background:#ffe27a;padding:22px 30px;transform:rotate(-5deg);box-shadow:8px 10px 0 rgba(0,0,0,.35);left:70px;top:690px;width:520px;line-height:1.35}
.toast{position:absolute;left:60px;right:60px;top:690px;font-size:44px;font-weight:700;padding:26px 34px;border-radius:30px;background:#fff;color:#063b36;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.toast.warn{background:#ffd166;color:#3a2a00}
#bad{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:84px;font-weight:700;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6);z-index:5;line-height:1.3}
#redov{position:absolute;inset:0;background:#ff2d45;mix-blend-mode:multiply;opacity:0;z-index:4}
#win{position:absolute;left:60px;right:60px;top:700px;text-align:center;font-size:96px;font-weight:700;line-height:1.3;z-index:12;opacity:0;color:#fff}
#win b{color:#5eead4}
#logo{position:absolute;left:0;right:0;top:520px;text-align:center;display:none;z-index:13}
#mk{width:240px;height:240px;margin:0 auto;border-radius:64px;background:#fff;display:grid;place-items:center;box-shadow:0 30px 90px rgba(0,0,0,.35)}
#nm{font-family:K;font-size:150px;margin-top:30px}
#sl{font-size:58px;margin-top:16px;font-weight:700}
#fr{display:inline-block;margin-top:70px;background:#ffd166;color:#063b36;font-size:52px;font-weight:700;padding:18px 44px;border-radius:99px}
#url{font-size:48px;margin-top:44px;direction:ltr;font-weight:700;color:#ccfbf1}
#title{position:absolute;inset:0;z-index:20;background:#0b0b0f;display:grid;place-items:center;text-align:center}
#title div{font-size:110px;font-weight:700;line-height:1.3}
#title span{color:#5eead4}
</style></head><body><div id="R">
<div id="A" class="half"><div class="tag"></div><div class="ev"></div><div class="shelf"></div><div class="note"></div><div id="bad"></div><div id="redov"></div></div>
<div id="Bh" class="half"><div class="tag"></div><div class="ev"></div><div class="shelf"></div><div class="toast"></div></div>
<div id="div"></div><div id="vs">VS</div>
<div id="win"></div>
<div id="logo"><div id="mk"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#0d6b66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="pl" d="M2 12h4l2.5-6 4 12 3-9 2 3h4.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><div id="nm">نبض</div><div id="sl"></div><div id="fr">🎁 جرّبوه مجاناً 14 يوماً</div><div id="url">nabd.sy</div></div>
<div id="title"><div></div></div>
</div>
<script src="cfg.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s),B=60/C.bpm;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
const TIT=C.titleB*B, evT=C.events.map((_,i)=>TIT+B+i*C.evB*B), BAD=evT[evT.length-1]+C.evB*B, WIN=BAD+C.badB*B, LOGO=WIN+C.winB*B, TOTAL=LOGO+C.endB*B;
window.TOTAL=TOTAL; window.EVENTS={bpm:C.bpm,total:TOTAL,title:TIT,events:evT,bad:BAD,win:WIN,logo:LOGO};
$("#title div").innerHTML=C.title; $("#A .tag").textContent=C.tagA; $("#Bh .tag").textContent=C.tagB; $("#bad").innerHTML=C.bad; $("#win").innerHTML=C.win; $("#sl").textContent=C.slogan;
function shelf(sel){return C.items.map(it=>{const d=document.createElement("div");d.className="it";d.innerHTML=`<div class="ico">${it.ic}</div><div class="nm">${it.n}</div><div class="bar"><div class="fill"></div></div><div class="q"></div>`;$(sel+" .shelf").appendChild(d);return {f:d.querySelector(".fill"),q:d.querySelector(".q"),it};});}
const SA=shelf("#A"), SB=shelf("#Bh");
// الكمية عند الزمن t: تنقص مع كل حدث حسب استهلاكه
function qtyAt(i,t){let q=C.items[i].q0; C.events.forEach((e,k)=>{const a=t-evT[k]-.35; if(a>0) q-=(e.use[i]||0)*ease(a*2.5);}); return q;}
function render(t){
  const ti=$("#title"); const tf=cl((t-TIT+.25)*4); ti.style.opacity=1-tf; ti.style.display=tf>=1?"none":"grid"; ti.firstElementChild.style.transform=`scale(${.85+.15*back(t*2.5)})`;
  // الأحداث المشتركة
  const k=evT.filter(x=>t>=x).length-1;
  ["#A","#Bh"].forEach(s=>{const e=$(s+" .ev"); if(k<0){e.style.opacity=0;return;} const a=t-evT[k]; e.textContent=C.events[k].t; e.style.opacity=ease(a*4); e.style.transform=`translateX(${(1-ease(a*4))*-80}px)`;});
  // رفّ «دون نبض»: الأرقام لا تتغير (لا أحد يعدّ)، ورفّ «مع نبض»: يُخصم تلقائياً
  SA.forEach((r,i)=>{const q=C.items[i].q0; r.f.style.width=(q/C.items[i].max*100)+"%"; r.q.textContent="؟";});
  SB.forEach((r,i)=>{const q=qtyAt(i,t); r.f.style.width=(Math.max(0,q)/C.items[i].max*100)+"%"; r.q.textContent=Math.round(q); const low=q<=C.items[i].min+.01; r.f.style.background=low?"#ffd166":"#5eead4";});
  // الملصق الأصفر في الأعلى والإشعار في الأسفل
  const n=$("#A .note"), to=$("#Bh .toast");
  if(k>=0&&t<BAD){const a=t-evT[k]-.5; const e=C.events[k]; n.textContent=e.note; n.style.opacity=a>0?ease(a*5):0; n.style.transform=`rotate(-5deg) scale(${a>0?back(a*4):.6})`;
    to.textContent=e.toast; to.className="toast"+(e.warn?" warn":""); to.style.opacity=a>0?ease(a*5):0; to.style.transform=`translateY(${a>0?(1-back(a*4))*120:120}px)`;}
  else {n.style.opacity=0; to.style.opacity=t<WIN?1:0;}
  // لحظة النفاد في الأعلى
  const ba=t-BAD; $("#bad").style.opacity=ba>0&&t<WIN?ease(ba*4):0; $("#bad").style.transform=`scale(${ba>0?back(ba*3):.5}) rotate(${ba>0?Math.sin(ba*30)*2*Math.max(0,1-ba):0}deg)`;
  $("#redov").style.opacity=ba>0&&t<WIN?.55*ease(ba*3):0; $("#A .shelf").style.filter=ba>0?`grayscale(${ease(ba*3)})`:"none"; $("#A .shelf").style.opacity=ba>0?1-.8*ease(ba*3):1; $("#A .note").style.display=ba>0?"none":"block";
  // الانتصار: النصف السفلي يتمدد ويملأ الشاشة
  const wa=ease((t-WIN)/.7); $("#Bh").style.top=(960-960*wa)+"px"; $("#Bh").style.height=(960+960*wa)+"px";
  $("#div").style.top=(952-952*wa)+"px"; $("#div").style.opacity=1-wa; $("#vs").style.opacity=1-wa; $("#vs").style.transform=`rotate(${t*40}deg)`;
  ["#Bh .shelf","#Bh .ev","#Bh .tag"].forEach(s=>$(s).style.opacity=t>WIN?1-ease((t-WIN)*3):undefined);
  if(t>WIN) to.style.opacity=1-ease((t-WIN)*3);
  const w=t-WIN-.5; $("#win").style.opacity=w>0?ease(w*3)*(1-cl((t-LOGO+.2)*5)):0; $("#win").style.transform=`translateY(${w>0?(1-ease(w*3))*60:60}px)`;
  const lg=t-LOGO; $("#logo").style.display=lg>0?"block":"none";
  if(lg>0){$("#mk").style.transform=`scale(${back(lg*2)})`; $("#pl").style.strokeDashoffset=1-ease((lg-.2)/1);
    [["#nm",.4],["#sl",.9],["#fr",1.5],["#url",2.0]].forEach(([s,d])=>{const e=$(s),x=ease((lg-d)*2.5);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*40}px)`});}
}
window.render=render;
</script></body></html>
