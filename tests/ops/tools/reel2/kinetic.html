<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- ريل «كتابة متحركة» داكن فخم: كلمات كبيرة على الإيقاع ثم جوال ثلاثي الأبعاد ثم الشعار. CFG في cfg.js -->
<style>
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:K;src:url(fntfiles/reem-kufi-arabic-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:clip;background:#061615;font-family:P,sans-serif;color:#fff}
#bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(900px 900px at 50% 40%,#0f3a37 0%,#061615 70%)}
#glow{position:absolute;width:1400px;height:1400px;left:-160px;top:200px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.28),transparent 60%);filter:blur(10px)}
#grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20}
.stage{position:absolute;inset:0;display:none;z-index:5}
.w{position:absolute;left:0;right:0;text-align:center;font-weight:700;line-height:1.05;letter-spacing:-1px;text-shadow:0 10px 40px rgba(0,0,0,.4)}
.x{position:absolute;left:50%;width:260px;height:260px;margin-left:-130px;border-radius:50%;border:16px solid #ff4d4f;color:#ff4d4f;display:grid;place-items:center;font-size:170px;font-weight:700;line-height:1}
#ph{position:absolute;left:50%;top:380px;width:600px;height:1220px;margin-left:-300px;border-radius:72px;background:#0b0f10;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 3px #2f3638 inset,0 0 80px rgba(20,184,166,.25)}
#scr{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#fff}
#scr img{position:absolute;left:0;top:0;width:100%}
.chk{position:absolute;right:70px;left:70px;text-align:center;font-size:66px;font-weight:700}
.chk b{color:#5eead4}
#logo{position:absolute;left:0;right:0;top:560px;text-align:center}
#mk{width:240px;height:240px;margin:0 auto;border-radius:64px;background:linear-gradient(135deg,#14b8a6,#0d6b66);display:grid;place-items:center;box-shadow:0 30px 80px rgba(20,184,166,.45)}
#nm{font-family:K;font-size:150px;margin-top:30px}
#sl{font-size:58px;margin-top:20px;color:#d7f5f1}
#fr{display:inline-block;margin-top:70px;background:#ffd166;color:#08403d;font-size:52px;padding:18px 44px;border-radius:99px}
#url{font-size:46px;margin-top:40px;color:#9fe3da;direction:ltr}
#bar{position:absolute;bottom:0;left:0;height:10px;background:#14b8a6;z-index:21}
</style></head><body>
<div id="bg"><div id="glow"></div><div id="grain"></div></div>
<div id="A" class="stage"></div>
<div id="B" class="stage"><div id="ph"><div id="scr"></div></div><div class="chk" id="chk"></div></div>
<div id="C" class="stage"><div id="logo"><div id="mk"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="pl" d="M2 12h4l2.5-6 4 12 3-9 2 3h4.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><div id="nm">نبض</div><div id="sl"></div><div id="fr">🎁 جرّبوه مجاناً 14 يوماً</div><div id="url">nabd.sy</div></div></div>
<div id="flash"></div><div id="bar"></div>
<script src="cfg.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s),B=60/C.bpm;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// المقاطع
let t0=0;const P=[];
C.pains.forEach(p=>{const n=p.words.length+2;P.push({k:"A",t0,d:n*B,p});t0+=n*B;});
const Bt0=t0, Bd=C.shots.length*4*B; P.push({k:"F",t0:t0,d:2*B}); t0+=2*B; P.push({k:"B",t0,d:Bd}); t0+=Bd;
P.push({k:"C",t0,d:C.endBeats*B}); t0+=C.endBeats*B;
const TOTAL=t0; window.TOTAL=TOTAL;
$("#sl").textContent=C.slogan;
const imgs=C.shots.map(s=>{const i=new Image();i.src=s.img;$("#scr").appendChild(i);return i;});
function render(t){
  document.querySelectorAll(".stage").forEach(s=>s.style.display="none");
  $("#bar").style.width=(t/TOTAL*100)+"%"; $("#flash").style.opacity=0;
  const sc=P.find(s=>t>=s.t0&&t<s.t0+s.d)||P[P.length-1], lt=t-sc.t0, beat=lt/B;
  $("#glow").style.transform=`scale(${1+.05*Math.sin(t*2)}) translateY(${Math.sin(t*.7)*40}px)`;
  if(sc.k==="A"){const A=$("#A");A.style.display="block";const W=sc.p.words;let h="";
    const total=W.length; const lines=W.map((w,i)=>{const a=beat-i;if(a<0)return"";const s=back(a*2.2);const fs=w.size||150;
      const y=620+(i-(total-1)/2)*(fs*1.25);return `<div class="w" style="top:${y}px;font-size:${fs}px;color:${w.c||"#fff"};transform:scale(${s});opacity:${Math.min(1,a*4)}">${w.t}</div>`});
    h=lines.join("");const xa=beat-total;
    if(xa>0){const s=back(xa*2.5);h=h.replace(/<div class="w"/g,'<div class="w" style="filter:blur(1px);opacity:.45" data-x');
      h=lines.map(l=>l.replace('opacity:1"','opacity:.35"')).join("")+`<div class="x" style="top:1130px;transform:scale(${s}) rotate(${(1-Math.min(1,xa*2.5))*-25}deg)">✕</div>`;}
    A.innerHTML=h; const shake=xa>0&&xa<.3?Math.sin(xa*90)*10:0; A.style.transform=`translateX(${shake}px)`;}
  if(sc.k==="F"){const A=$("#A");A.style.display="block";const a=beat;A.innerHTML=`<div class="w" style="top:800px;font-size:220px;color:#5eead4;transform:scale(${back(a*2)})">${C.turn}</div>`;$("#flash").style.opacity=Math.max(0,.8-a*1.6);}
  if(sc.k==="B"){const S=$("#B");S.style.display="block";const i=Math.min(C.shots.length-1,Math.floor(beat/4)),li=beat-i*4;
    const ry=18-Math.min(1,lt/Bd)*30, rx=6-Math.sin(lt)*3, z=1+ease(lt/1.2)*.0;
    $("#ph").style.transform=`perspective(1600px) rotateY(${ry}deg) rotateX(${rx}deg) translateY(${(1-ease(lt/.8))*400}px) scale(${.92+.06*ease(lt/Bd)})`;
    imgs.forEach((im,k)=>{const sh=C.shots[k];im.style.opacity=k===i?Math.min(1,li*3):(k===i-1?Math.max(0,1-li*3):0);im.style.transform=`translateY(${-(sh.scroll||0)*ease(li/4)}px)`;});
    const c=$("#chk"), ca=back(li*1.6);c.style.top=(i%2?250:1660)+"px";c.innerHTML=`<b>✓</b> ${C.shots[i].label}`;c.style.transform=`scale(${ca})`;c.style.opacity=Math.min(1,li*3);}
  if(sc.k==="C"){$("#C").style.display="block";const a=beat;$("#mk").style.transform=`scale(${back(a*1.2)})`;$("#pl").style.strokeDashoffset=1-ease(a/1.5);
    [["#nm",.8],["#sl",1.6],["#fr",2.6],["#url",3.2]].forEach(([s,d])=>{const e=$(s),x=ease((a-d)*2);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*40}px)`});}
}
window.render=render;
</script></body></html>
