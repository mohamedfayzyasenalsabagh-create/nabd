<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- ريل «مروحة الألوان»: خلفية ورقية بيضاء بأسلوب كتالوج ألوان، مروحة بطاقات ألوان تنفتح، وكل بطاقة تُختار فيتلوّن جوال (واجهة مبسّطة مرسومة، ليست لقطة حقيقية) بثيمها
     ← شعار العيادة يظهر في الواجهة ← الشعار. الإعداد في cfg.js (CFG) -->
<style>
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-500-normal.woff2);font-weight:500;unicode-range:U+0000-00FF}
@font-face{font-family:K;src:url(fntfiles/reem-kufi-arabic-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:clip;font-family:P,sans-serif;background:#f4f1ea;color:#1d1d1f}
#R{position:absolute;inset:0;overflow:hidden;background:#f4f1ea}
#bgc{position:absolute;inset:0;opacity:.0}
#cap{position:absolute;top:120px;left:60px;right:60px;text-align:center;font-size:76px;font-weight:700;line-height:1.3;z-index:10}
#cap i{font-style:normal;display:inline-block;padding:0 18px;border-radius:14px;color:#fff}
/* المروحة */
#fan{position:absolute;left:540px;top:1700px;width:0;height:0;z-index:3}
.chip{position:absolute;left:-90px;bottom:0;width:180px;height:780px;border-radius:22px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.12);transform-origin:50% 100%;overflow:hidden}
.chip .c{height:620px}
.chip .n{height:160px;padding:16px 14px;font-size:30px;font-weight:700;line-height:1.3;text-align:center;display:flex;align-items:center;justify-content:center}
/* الجوال */
#ph{position:absolute;left:250px;top:430px;width:580px;height:1160px;border-radius:80px;background:#111;padding:20px;z-index:5;box-shadow:0 40px 90px rgba(0,0,0,.25)}
#scr{width:100%;height:100%;border-radius:62px;overflow:hidden;position:relative;background:var(--bg)}
#top{height:200px;background:var(--acc);display:flex;align-items:center;gap:22px;padding:60px 34px 0;color:#fff}
#lg{width:96px;height:96px;border-radius:26px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:54px;overflow:hidden}
#cn{font-size:40px;font-weight:700}
#cs{font-size:26px;opacity:.85}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:28px}
.k{border-radius:28px;background:var(--card);padding:22px;color:var(--ink)}
.k b{display:block;font-size:56px;color:var(--acc);direction:ltr;text-align:right}
.k span{font-size:26px;opacity:.75}
.ls{padding:0 28px}
.li{height:110px;border-radius:26px;background:var(--card);margin-bottom:16px;display:flex;align-items:center;gap:18px;padding:0 22px;color:var(--ink);font-size:32px;font-weight:700}
.li i{width:66px;height:66px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;color:var(--acc);font-size:30px}
.li em{margin-right:auto;font-style:normal;font-size:24px;padding:6px 14px;border-radius:99px;background:var(--soft);color:var(--acc)}
#nav{position:absolute;left:0;right:0;bottom:0;height:130px;background:var(--card);display:flex;justify-content:space-around;align-items:center}
#nav i{width:60px;height:60px;border-radius:18px;background:var(--soft)}
#nav i.on{background:var(--acc)}
#tname{position:absolute;left:0;right:0;top:1620px;text-align:center;font-size:56px;font-weight:700;z-index:6}
#rx{position:absolute;left:170px;top:520px;width:740px;height:980px;background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.18);padding:60px;z-index:7;opacity:0}
#rx .hd{display:flex;align-items:center;gap:26px;border-bottom:6px solid var(--clinic);padding-bottom:26px}
#rx .lg2{width:120px;height:120px;border-radius:30px;background:var(--clinic);display:grid;place-items:center;font-size:66px}
#rx h4{font-size:46px}
#rx p{font-size:28px;color:#555}
#rx .ln{height:26px;border-radius:13px;background:#eee;margin-top:34px}
#rx .rxs{font-size:90px;font-weight:700;color:var(--clinic);margin-top:30px;font-family:serif}
#logo{position:absolute;left:0;right:0;top:520px;text-align:center;display:none;z-index:20}
#mk{width:240px;height:240px;margin:0 auto;border-radius:64px;background:#0d6b66;display:grid;place-items:center;box-shadow:0 30px 80px rgba(13,107,102,.3)}
#nm{font-family:K;font-size:150px;margin-top:30px;color:#0d3b37}
#sl{font-size:58px;margin-top:16px;font-weight:700}
#fr{display:inline-block;margin-top:70px;background:#ffd166;color:#1d1d1f;font-size:52px;font-weight:700;padding:18px 44px;border-radius:99px}
#url{font-size:48px;margin-top:44px;direction:ltr;font-weight:700;color:#0d6b66}
</style></head><body><div id="R">
<div id="bgc"></div>
<div id="cap"></div>
<div id="fan"></div>
<div id="ph"><div id="scr"><div id="top"><div id="lg">🩺</div><div><div id="cn"></div><div id="cs"></div></div></div>
  <div class="kp"><div class="k"><b>14</b><span>مواعيد اليوم</span></div><div class="k"><b>3</b><span>بالانتظار</span></div></div>
  <div class="ls"><div class="li"><i>س</i>سارة أحمد<em>10:30</em></div><div class="li"><i>خ</i>خالد يوسف<em>10:45</em></div><div class="li"><i>ل</i>لمى العلي<em>11:00</em></div></div>
  <div id="nav"><i class="on"></i><i></i><i></i><i></i></div></div></div>
<div id="tname"></div>
<div id="rx"><div class="hd"><div class="lg2">🦷</div><div><h4></h4><p></p></div></div><div class="rxs">℞</div><div class="ln" style="width:80%"></div><div class="ln" style="width:60%"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:45%"></div></div>
<div id="logo"><div id="mk"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="pl" d="M2 12h4l2.5-6 4 12 3-9 2 3h4.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><div id="nm">نبض</div><div id="sl"></div><div id="fr">🎁 جرّبوه مجاناً 14 يوماً</div><div id="url">nabd.sy</div></div>
</div>
<script src="cfg.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s),B=60/C.bpm;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), io=x=>{x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
$("#cn").textContent=C.clinic; $("#cs").textContent=C.clinicSub; $("#rx h4").textContent=C.clinic; $("#rx p").textContent=C.rxSub; $("#sl").textContent=C.slogan;
const chips=C.themes.map((th,i)=>{const d=document.createElement("div");d.className="chip";d.innerHTML=`<div class="c" style="background:linear-gradient(${th.acc} 0 60%,${th.bg} 60% 100%)"></div><div class="n">${th.n}</div>`;$("#fan").appendChild(d);return d;});
// الخط الزمني
const FAN=C.introB*B, PH=FAN+3*B, thT=C.themes.map((_,i)=>PH+1*B+i*C.perB*B), RX=PH+(1+C.themes.length*C.perB)*B, LOGO=RX+C.rxB*B, TOTAL=LOGO+C.endB*B;
window.TOTAL=TOTAL; window.EVENTS={bpm:C.bpm,total:TOTAL,fan:FAN,phone:PH,themes:thT,rx:RX,logo:LOGO};
const mix=(a,b,p)=>{const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=h(a),Bc=h(b);return `rgb(${A.map((v,i)=>Math.round(v+(Bc[i]-v)*p)).join(",")})`;};
function render(t){
  const lg=t-LOGO, fo=1-cl(lg*4);
  // المروحة: تنفتح ثم تبرز البطاقة المختارة
  const fa=t-0.2; const spread=ease(fa*1.5)*(t<PH?1:1-.0);
  const sel=thT.filter(x=>t>=x).length-1;
  chips.forEach((d,i)=>{const n=chips.length; const ang=(i-(n-1)/2)*11*spread; let up=0,sc=1;
    if(i===sel&&t<RX){const a=t-thT[sel]; up=-60*back(a*4); sc=1.04;}
    const down=t>=PH?ease((t-PH)/(.8))*1:0; // تنخفض المروحة خلف الجوال
    d.style.transform=`rotate(${ang}deg) translateY(${up+down*480}px) scale(${sc})`; d.style.opacity=(t<PH?1:1-ease((t-PH)*2.5))*fo; d.style.zIndex=i===sel?50:i;});
  $("#fan").style.top=(1700-Math.min(1,ease(fa*1.2))*0)+"px";
  // الجوال يصعد ويتلوّن بالثيم الحالي (انتقال لوني ناعم)
  const ph=$("#ph"), pa=t-PH; ph.style.opacity=(pa<0?0:1)*(t<RX?1:1-ease((t-RX)*3)); ph.style.transform=`translateY(${pa<0?1400:(1-back(pa*2))*1400}px) rotate(${pa<0?0:(1-ease(pa*2))*-6}deg)`;
  const i=Math.max(0,sel), th=C.themes[i], prev=C.themes[Math.max(0,i-1)]; const p=sel<0?1:cl((t-thT[i])/.35);
  const s=$("#scr").style; ["acc","bg","card","ink","soft"].forEach(k=>s.setProperty("--"+k,mix(prev[k],th[k],p)));
  $("#R").style.background=mix(prev.page||"#f4f1ea",th.page||"#f4f1ea",p);
  const tn=$("#tname"); tn.textContent=sel>=0?th.n:""; tn.style.color=th.page&&th.page<"#555555"?"#fff":"#1d1d1f"; tn.style.opacity=sel>=0&&t<RX?ease((t-thT[i])*4):0; tn.style.transform=`translateY(${sel>=0?(1-ease((t-thT[i])*4))*30:0}px)`;
  // شعار العيادة يظهر في الواجهة
  const lga=t-(thT[C.logoAt]||999); $("#lg").textContent=lga>0?C.clinicLogo:"🩺"; $("#lg").style.transform=lga>0&&lga<.4?`scale(${back(lga*3)})`:"none"; $("#lg").style.background=lga>0?"#fff":"rgba(255,255,255,.95)";
  // الوصفة المطبوعة بلون العيادة وشعارها
  const rx=$("#rx"), ra=t-RX; rx.style.opacity=ra<0?0:ease(ra*3)*fo; rx.style.transform=`translateY(${ra<0?200:(1-back(ra*2.5))*200}px) rotate(${ra<0?0:(1-ease(ra*2.5))*4-1}deg)`;
  rx.style.setProperty("--clinic",C.clinicColor); if(t>=RX) $("#R").style.background=mix(C.themes[C.themes.length-1].page||"#f4f1ea","#f4f1ea",cl(ra*2));
  // العناوين
  const cs=C.caps.filter(c=>t>=eval(c.at)); const c=cs[cs.length-1], cp=$("#cap");
  if(c&&t<LOGO){cp.innerHTML=c.t; const a=t-eval(c.at); cp.style.opacity=ease(a*4); cp.style.color=(sel>=0&&t<RX&&th.page&&th.page<"#555555")?"#fff":"#1d1d1f"; cp.querySelectorAll("i").forEach(e=>e.style.background=sel>=0&&t<RX?th.acc:C.clinicColor);} else cp.style.opacity=0;
  const L=$("#logo"); L.style.display=lg>0?"block":"none";
  if(lg>0){$("#mk").style.transform=`scale(${back(lg*2)})`; $("#pl").style.strokeDashoffset=1-ease((lg-.2)/1);
    [["#nm",.4],["#sl",.9],["#fr",1.5],["#url",2.0]].forEach(([s,d])=>{const e=$(s),x=ease((lg-d)*2.5);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*40}px)`});}
}
window.render=render;
</script></body></html>
