<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<!-- ريل «الساعة الذكية»: خلفية سوداء ووجه ساعة دائري بحلقات نشاط نيون: حلقة الجلسات تمتلئ (8/12) ← منحنى الألم ينخفض جلسة بعد جلسة
     ← بطاقات التمارين المنزلية تُسحب كإشعارات ← الشعار. الإعداد في cfg.js (CFG) -->
<style>
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(fntfiles/ibm-plex-sans-arabic-latin-500-normal.woff2);font-weight:500;unicode-range:U+0000-00FF}
@font-face{font-family:K;src:url(fntfiles/reem-kufi-arabic-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:clip;font-family:P,sans-serif;background:#000;color:#fff}
#R{position:absolute;inset:0;overflow:hidden;background:#000}
#cap{position:absolute;top:130px;left:60px;right:60px;text-align:center;font-size:72px;font-weight:700;line-height:1.3;z-index:10}
#cap b{color:#b6ff3b}
#band{position:absolute;left:340px;width:400px;top:-200px;bottom:-200px;background:linear-gradient(90deg,#1a1a1a,#2a2a2a 50%,#1a1a1a);border-radius:60px;opacity:.9}
#band:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 38px,rgba(255,255,255,.04) 38px 40px)}
#face{position:absolute;left:140px;top:500px;width:800px;height:900px;border-radius:200px;background:#050505;box-shadow:0 0 0 22px #2b2b2e,0 0 0 26px #444,0 40px 100px rgba(0,0,0,.8);overflow:hidden}
#crown{position:absolute;left:930px;top:820px;width:44px;height:130px;border-radius:14px;background:linear-gradient(90deg,#555,#999,#555)}
.pg{position:absolute;inset:0;opacity:0}
#rings svg{position:absolute;left:110px;top:100px;width:580px;height:580px;transform:rotate(-90deg)}
#rings .ctr{position:absolute;left:0;right:0;top:300px;text-align:center}
#rings .big{font-size:120px;font-weight:700;direction:ltr;line-height:1}
#rings .sm{font-size:40px;color:#aaa;margin-top:10px}
#rings .leg{position:absolute;left:60px;right:60px;bottom:60px;display:flex;justify-content:space-around;font-size:34px;font-weight:700}
#pain h4,#ex h4{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:48px}
#pain svg{position:absolute;left:60px;top:200px;width:680px;height:480px;overflow:visible}
#pain .vals{position:absolute;left:60px;right:60px;bottom:90px;display:flex;justify-content:space-between;font-size:56px;font-weight:700;direction:ltr}
#pain .vals span:first-child{color:#ff4d6d}
#pain .vals span:last-child{color:#b6ff3b}
.ex{position:absolute;left:50px;right:50px;height:180px;border-radius:44px;background:#1c1c1e;padding:26px 34px;display:flex;flex-direction:column;justify-content:center}
.ex b{font-size:44px}
.ex span{font-size:32px;color:#9be7ff;margin-top:8px}
#title{position:absolute;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:#000}
#title div{font-size:104px;font-weight:700;line-height:1.3}
#title b{color:#b6ff3b}
#logo{position:absolute;inset:0;z-index:40;display:none;text-align:center;padding-top:520px;background:#000}
#mk{width:240px;height:240px;margin:0 auto;border-radius:64px;background:#14b8a6;display:grid;place-items:center;box-shadow:0 0 80px rgba(20,184,166,.5)}
#nm{font-family:K;font-size:150px;margin-top:30px}
#sl{font-size:58px;margin-top:16px;font-weight:700}
#fr{display:inline-block;margin-top:70px;background:#b6ff3b;color:#000;font-size:52px;font-weight:700;padding:18px 44px;border-radius:99px}
#url{font-size:48px;margin-top:44px;direction:ltr;font-weight:700;color:#9be7ff}
</style></head><body><div id="R">
<div id="band"></div>
<div id="cap"></div>
<div id="face">
  <div class="pg" id="rings"><svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="84" fill="none" stroke="#24380a" stroke-width="28"/><circle id="r1" cx="100" cy="100" r="84" fill="none" stroke="#b6ff3b" stroke-width="28" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</svg>
    <div class="ctr"><div class="big" id="cnt"></div><div class="sm" id="pkg"></div></div>
    <div class="leg"><span style="color:#b6ff3b">● الجلسات المنجزة</span></div></div>
  <div class="pg" id="pain"><h4></h4><svg viewBox="0 0 680 480"><g id="grid"></g><path id="pl2" d="" fill="none" stroke="url(#gr)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#b6ff3b"/></linearGradient></defs><g id="dots"></g></svg><div class="vals"><span></span><span></span></div></div>
  <div class="pg" id="ex"><h4></h4><div id="exs"></div></div>
</div>
<div id="crown"></div>
<div id="title"><div></div></div>
<div id="logo"><div id="mk"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="pl" d="M2 12h4l2.5-6 4 12 3-9 2 3h4.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><div id="nm">نبض</div><div id="sl"></div><div id="fr">🎁 جرّبوه مجاناً 14 يوماً</div><div id="url">nabd.sy</div></div>
</div>
<script src="cfg.js"></script>
<script>
const C=CFG,$=s=>document.querySelector(s),B=60/C.bpm;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), io=x=>{x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, back=x=>{x=Math.max(0,Math.min(1,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
$("#title div").innerHTML=C.title; $("#pkg").textContent=C.pkg; $("#pain h4").textContent=C.painT; $("#ex h4").textContent=C.exT; $("#sl").textContent=C.slogan;
const pains=C.pains, n=pains.length; const px=i=>20+i*(640/(n-1)), py=v=>440-v*42;
$("#pl2").setAttribute("d",pains.map((v,i)=>(i?"L":"M")+px(i)+" "+py(v)).join(" "));
$("#grid").innerHTML=[0,2,4,6,8,10].map(v=>`<line x1="0" x2="680" y1="${py(v)}" y2="${py(v)}" stroke="#222" stroke-width="2"/>`).join("");
$("#dots").innerHTML=pains.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="14" fill="#000" stroke="#fff" stroke-width="5" opacity="0"/>`).join("");
const dots=[...document.querySelectorAll("#dots circle")];
$("#pain .vals span:first-child").textContent=pains[0]+"/10"; $("#pain .vals span:last-child").textContent=pains[n-1]+"/10";
const exs=C.ex.map((e,i)=>{const d=document.createElement("div");d.className="ex";d.style.top=(200+i*210)+"px";d.innerHTML=`<b>${e.n}</b><span>${e.d}</span>`;$("#exs").appendChild(d);return d;});
// الخط الزمني (الإيقاع نصف السرعة: كل وحدة = ضربتان)
const U=2*B, RG=C.titleU*U, PN=RG+C.ringU*U, EX=PN+C.painU*U, LOGO=EX+C.exU*U, TOTAL=LOGO+C.endU*U;
const sessT=Array.from({length:C.done},(_,i)=>RG+.3*U+i*(C.ringU-1.2)*U/C.done);
const dotT=pains.map((_,i)=>PN+.6*U+i*(C.painU-1.6)*U/n), exT=exs.map((_,i)=>EX+.5*U+i*.8*U);
window.TOTAL=TOTAL; window.EVENTS={bpm:C.bpm,total:TOTAL,rings:RG,sessions:sessT,pain:PN,dots:dotT,ex:EX,exs:exT,logo:LOGO};
function page(id,t0,t1,t){const e=$(id),a=t-t0,b=t-t1; const v=a<0?0:b>0?1-cl(b*4):cl(a*4); e.style.opacity=v; e.style.transform=`scale(${a<0?.9:b>0?1+.1*cl(b*4):.9+.1*ease(a*4)})`;}
function render(t){
  const ti=$("#title"), tf=cl((t-RG+.25)*4); ti.style.opacity=1-tf; ti.style.display=tf>=1?"none":"grid";
  page("#rings",RG,PN,t); page("#pain",PN,EX,t); page("#ex",EX,LOGO,t);
  // الحلقات: الجلسات تمتلئ قفزة مع كل جلسة
  const k=sessT.filter(x=>t>=x).length; const last=k?t-sessT[k-1]:0; const fr=(k-1+ease(last*6))/C.total;
  $("#r1").style.strokeDashoffset=1-(k?fr:0);
  $("#cnt").textContent=`${k} / ${C.total}`;
  // منحنى الألم
  $("#pl2").style.strokeDashoffset=1-cl((t-dotT[0])/(dotT[n-1]-dotT[0]));
  dots.forEach((d,i)=>{const a=t-dotT[i]; d.setAttribute("opacity",a<0?0:1); d.setAttribute("r",a<0?0:14*back(a*4));});
  // بطاقات التمارين
  exs.forEach((e,i)=>{const a=t-exT[i]; e.style.opacity=a<0?0:ease(a*5); e.style.transform=`translateX(${a<0?-800:(1-back(a*3))*-800}px)`;});
  $("#face").style.transform=`translateY(${Math.sin(t*1.3)*6}px)`;
  const cs=C.caps.filter(c=>t>=eval(c.at)); const c=cs[cs.length-1], cp=$("#cap");
  if(c&&t<LOGO){cp.innerHTML=c.t; const a=t-eval(c.at); cp.style.opacity=ease(a*4); cp.style.transform=`translateY(${(1-ease(a*4))*30}px)`;} else cp.style.opacity=0;
  const lg=t-LOGO, L=$("#logo"); L.style.display=lg>0?"block":"none";
  if(lg>0){L.style.opacity=ease(lg*3); $("#mk").style.transform=`scale(${back(lg*2)})`; $("#pl").style.strokeDashoffset=1-ease((lg-.2)/1);
    [["#nm",.4],["#sl",.9],["#fr",1.5],["#url",2.0]].forEach(([s,d])=>{const e=$(s),x=ease((lg-d)*2.5);e.style.opacity=x;e.style.transform=`translateY(${(1-x)*40}px)`});}
}
window.render=render;
</script></body></html>
