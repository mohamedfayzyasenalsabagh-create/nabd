plugins { id 'com.android.application' }
android {
    namespace 'com.nabd.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nabd.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        // مفتاح التوقيع لا يُحفظ في المستودع: يأتي من أسرار GitHub عند البناء
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: '../release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'nabd'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
