plugins { id 'com.android.application' }
android {
    namespace 'com.nabd.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nabd.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('../nabd.keystore')
            storePassword 'nabdplatform'
            keyAlias 'nabd'
            keyPassword 'nabdplatform'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
